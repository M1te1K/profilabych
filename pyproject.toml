[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "profilabych"
version = "0.1.0"
description = "Модульный AI-агент с Tool Calling, SQLite и локальным CLI"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiogram>=3.26,<4",
    "aiosqlite>=0.21,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
]

[project.scripts]
profilabych = "profilabych.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/profilabych"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/profilabych"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true
